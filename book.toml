[book]
title = "The JVM — A Gentle Deep Dive"
authors = ["Brieuc Kaisin"]
description = "For the curious developer who wants to understand the machine under the code"
src = "docs"
language = "en"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/brkaisin/jvm-book"
edit-url-template = "https://github.com/brkaisin/jvm-book/edit/master/{path}"
site-url = "/jvm-book/"
additional-css = ["theme/custom.css"]
no-section-label = true

[output.html.search]
enable = true
limit-results = 20

[output.html.fold]
enable = true
level = 1
