<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 24 760 216" role="img" aria-labelledby="f5a-title f5a-desc">
  <title id="f5a-title">The operand stack while computing 1 + 2</title>
  <desc id="f5a-desc">Four snapshots of the operand stack, one after each instruction. After iconst_1 the stack holds 1. After iconst_2 it holds 2 on top of 1. iadd pops 2 and 1 and pushes their sum, so the stack holds only 3, highlighted. istore_1 pops 3 and stores it in local variable 1, leaving the stack empty.</desc>
  <defs>
    <marker id="f5a-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="fill-ink"/>
    </marker>
    <marker id="f5a-arrow-accent" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="fill-accent"/>
    </marker>
    <marker id="f5a-arrow-muted" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="fill-muted"/>
    </marker>
  </defs>
  <!-- step 1: iconst_1 -->
  <text x="96" y="44" class="t-mono t-mid">1</text>
  <path d="M96 52 V142" class="line" marker-end="url(#f5a-arrow)"/>
  <path d="M64 80 V176 H128 V80" class="line"/>
  <rect x="68" y="144" width="56" height="28" class="box"/>
  <text x="96" y="163" class="t-mid">1</text>
  <text x="96" y="204" class="t-mono t-mid">iconst_1</text>
  <text x="96" y="222" class="t-small t-muted t-mid">push 1</text>
  <!-- step 2: iconst_2 -->
  <text x="272" y="44" class="t-mono t-mid">2</text>
  <path d="M272 52 V110" class="line" marker-end="url(#f5a-arrow)"/>
  <path d="M240 80 V176 H304 V80" class="line"/>
  <rect x="244" y="144" width="56" height="28" class="box"/>
  <text x="272" y="163" class="t-mid">1</text>
  <rect x="244" y="112" width="56" height="28" class="box"/>
  <text x="272" y="131" class="t-mid">2</text>
  <text x="272" y="204" class="t-mono t-mid">iconst_2</text>
  <text x="272" y="222" class="t-small t-muted t-mid">push 2</text>
  <!-- step 3: iadd -->
  <text x="432" y="44" class="t-mono t-muted t-mid">2, 1</text>
  <path d="M432 108 V54" class="line-muted" marker-end="url(#f5a-arrow-muted)"/>
  <text x="464" y="44" class="t-mono t-accent t-mid">3</text>
  <path d="M464 52 V142" class="line-accent" marker-end="url(#f5a-arrow-accent)"/>
  <path d="M416 80 V176 H480 V80" class="line"/>
  <rect x="420" y="144" width="56" height="28" class="box-accent"/>
  <text x="448" y="163" class="t-mid">3</text>
  <text x="448" y="204" class="t-mono t-mid">iadd</text>
  <text x="448" y="222" class="t-small t-muted t-mid">pop 2 and 1, push 3</text>
  <!-- step 4: istore_1 -->
  <path d="M592 80 V176 H656 V80" class="line"/>
  <rect x="596" y="144" width="56" height="28" class="box-ghost"/>
  <path d="M624 140 V64 H696 V142" class="line-accent" marker-end="url(#f5a-arrow-accent)"/>
  <text x="660" y="56" class="t-mono t-accent t-mid">3</text>
  <rect x="668" y="144" width="56" height="28" class="box-accent"/>
  <text x="696" y="163" class="t-mid">3</text>
  <text x="696" y="190" class="t-mono t-muted t-mid">locals[1]</text>
  <text x="624" y="204" class="t-mono t-mid">istore_1</text>
  <text x="624" y="222" class="t-small t-muted t-mid">pop 3 into local 1</text>
</svg>
