<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 760 360" role="img" aria-labelledby="f9a-title f9a-desc">
  <title id="f9a-title">The same heap after mark-sweep, mark-compact and copying</title>
  <desc id="f9a-desc">A heap holds six objects, A to F. After marking, A, C and D are live and B, E and F are garbage. Mark-sweep frees the garbage in place: A, a hole where B was, C, D, then a hole where E and F were, so free memory is fragmented into two holes tracked on a free list. Mark-compact slides A, C and D together at the start of the heap, leaving one contiguous free block where allocation bumps a pointer. Copying copies A, C and D into an empty to-space, compacted, and the whole from-space is then empty; the two spaces swap roles for the next cycle.</desc>
  <defs>
    <marker id="f9a-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="fill-ink"/>
    </marker>
  </defs>
  <!-- legend -->
  <rect x="160" y="28" width="24" height="16" class="box-accent"/>
  <text x="192" y="41">live (marked)</text>
  <rect x="304" y="28" width="24" height="16" class="box"/>
  <text x="336" y="41">garbage</text>
  <rect x="424" y="28" width="24" height="16" class="box-ghost"/>
  <text x="456" y="41">free</text>
  <!-- row 1: before -->
  <text x="16" y="84" class="t-title">Before GC</text>
  <text x="16" y="101" class="t-small t-muted">marking done</text>
  <rect x="160" y="72" width="40" height="40" class="box-accent"/>
  <text x="180" y="97" class="t-mid">A</text>
  <rect x="200" y="72" width="40" height="40" class="box"/>
  <text x="220" y="97" class="t-mid t-muted">B</text>
  <rect x="240" y="72" width="40" height="40" class="box-accent"/>
  <text x="260" y="97" class="t-mid">C</text>
  <rect x="280" y="72" width="40" height="40" class="box-accent"/>
  <text x="300" y="97" class="t-mid">D</text>
  <rect x="320" y="72" width="40" height="40" class="box"/>
  <text x="340" y="97" class="t-mid t-muted">E</text>
  <rect x="360" y="72" width="40" height="40" class="box"/>
  <text x="380" y="97" class="t-mid t-muted">F</text>
  <text x="448" y="89" class="t-small t-muted">the heap every row below starts from</text>
  <text x="448" y="105" class="t-small t-muted">(for copying, it is the from-space)</text>
  <path d="M16 136 H744" class="rule"/>
  <!-- row 2: mark-sweep -->
  <text x="16" y="164" class="t-title">Mark-sweep</text>
  <text x="16" y="181" class="t-small t-muted">garbage freed in place</text>
  <rect x="160" y="152" width="40" height="40" class="box-accent"/>
  <text x="180" y="177" class="t-mid">A</text>
  <rect x="200" y="152" width="40" height="40" class="box-ghost"/>
  <rect x="240" y="152" width="40" height="40" class="box-accent"/>
  <text x="260" y="177" class="t-mid">C</text>
  <rect x="280" y="152" width="40" height="40" class="box-accent"/>
  <text x="300" y="177" class="t-mid">D</text>
  <rect x="320" y="152" width="80" height="40" class="box-ghost"/>
  <text x="448" y="169" class="t-warm">fragmented: two holes</text>
  <text x="448" y="185" class="t-small t-muted">kept on a free list</text>
  <path d="M16 216 H744" class="rule"/>
  <!-- row 3: mark-compact -->
  <text x="16" y="244" class="t-title">Mark-compact</text>
  <text x="16" y="261" class="t-small t-muted">objects slid together</text>
  <rect x="160" y="232" width="40" height="40" class="box-accent"/>
  <text x="180" y="257" class="t-mid">A</text>
  <rect x="200" y="232" width="40" height="40" class="box-accent"/>
  <text x="220" y="257" class="t-mid">C</text>
  <rect x="240" y="232" width="40" height="40" class="box-accent"/>
  <text x="260" y="257" class="t-mid">D</text>
  <rect x="280" y="232" width="120" height="40" class="box-ghost"/>
  <text x="340" y="256" class="t-small t-muted t-mid">free</text>
  <text x="448" y="249">one contiguous free block</text>
  <text x="448" y="265" class="t-small t-muted">allocation bumps a pointer</text>
  <path d="M16 296 H744" class="rule"/>
  <!-- row 4: copying -->
  <text x="16" y="340" class="t-title">Copying</text>
  <text x="16" y="357" class="t-small t-muted">live objects copied</text>
  <text x="160" y="320" class="t-small t-muted">from-space</text>
  <text x="448" y="320" class="t-small t-muted">to-space</text>
  <rect x="160" y="328" width="240" height="40" class="box-ghost"/>
  <text x="280" y="352" class="t-small t-muted t-mid">empty: every object left behind</text>
  <path d="M404 348 H444" class="line" marker-end="url(#f9a-arrow)"/>
  <rect x="448" y="328" width="40" height="40" class="box-accent"/>
  <text x="468" y="353" class="t-mid">A</text>
  <rect x="488" y="328" width="40" height="40" class="box-accent"/>
  <text x="508" y="353" class="t-mid">C</text>
  <rect x="528" y="328" width="40" height="40" class="box-accent"/>
  <text x="548" y="353" class="t-mid">D</text>
  <rect x="568" y="328" width="120" height="40" class="box-ghost"/>
  <text x="628" y="352" class="t-small t-muted t-mid">free</text>
</svg>
