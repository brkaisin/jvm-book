<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 760 408" role="img" aria-labelledby="f9b-title f9b-desc">
  <title id="f9b-title">Application threads and GC threads on a shared time axis</title>
  <desc id="f9b-desc">Top: a stop-the-world collector. Three application threads run until they all stop at a safepoint; during the pause that follows only the GC threads work, marking and collecting, and then the application threads resume. Bottom: a mostly concurrent collector. The GC threads do most of their work while the three application threads keep running, and the application is stopped only for two short pauses, one at the start and one at the end of the concurrent work.</desc>
  <defs>
    <marker id="f9b-arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="fill-muted"/>
    </marker>
  </defs>
  <!-- panel 1: stop-the-world -->
  <text x="16" y="36" class="t-title">Stop-the-world collector</text>
  <rect x="376" y="60" width="128" height="112" class="box-warm"/>
  <text x="372" y="52" class="t-small t-muted t-end">all application threads stop at a safepoint</text>
  <text x="16" y="77">app thread 1</text>
  <text x="16" y="101">app thread 2</text>
  <text x="16" y="125">app thread 3</text>
  <text x="16" y="157">GC threads</text>
  <rect x="152" y="64" width="224" height="16" class="box"/>
  <rect x="504" y="64" width="224" height="16" class="box"/>
  <rect x="152" y="88" width="224" height="16" class="box"/>
  <rect x="504" y="88" width="224" height="16" class="box"/>
  <rect x="152" y="112" width="224" height="16" class="box"/>
  <rect x="504" y="112" width="224" height="16" class="box"/>
  <path d="M376 72 H504 M376 96 H504 M376 120 H504" class="line-muted dashed"/>
  <rect x="376" y="140" width="128" height="28" class="box-accent"/>
  <text x="440" y="159" class="t-mid">mark and collect</text>
  <text x="440" y="192" class="t-warm t-mid">stop-the-world pause</text>
  <path d="M16 220 H744" class="rule"/>
  <!-- panel 2: mostly concurrent -->
  <text x="16" y="252" class="t-title">Mostly concurrent collector</text>
  <rect x="296" y="268" width="8" height="112" class="box-warm"/>
  <rect x="568" y="268" width="8" height="112" class="box-warm"/>
  <text x="16" y="285">app thread 1</text>
  <text x="16" y="309">app thread 2</text>
  <text x="16" y="333">app thread 3</text>
  <text x="16" y="365">GC threads</text>
  <rect x="152" y="272" width="144" height="16" class="box"/>
  <rect x="304" y="272" width="264" height="16" class="box"/>
  <rect x="576" y="272" width="152" height="16" class="box"/>
  <rect x="152" y="296" width="144" height="16" class="box"/>
  <rect x="304" y="296" width="264" height="16" class="box"/>
  <rect x="576" y="296" width="152" height="16" class="box"/>
  <rect x="152" y="320" width="144" height="16" class="box"/>
  <rect x="304" y="320" width="264" height="16" class="box"/>
  <rect x="576" y="320" width="152" height="16" class="box"/>
  <rect x="296" y="348" width="8" height="28" class="box-accent"/>
  <rect x="304" y="348" width="264" height="28" class="box-accent"/>
  <rect x="568" y="348" width="8" height="28" class="box-accent"/>
  <text x="436" y="367" class="t-mid">concurrent work</text>
  <text x="300" y="416" class="t-warm t-mid">short pause</text>
  <text x="572" y="416" class="t-warm t-mid">short pause</text>
  <path d="M152 396 H728" class="line-muted" marker-end="url(#f9b-arrow)"/>
  <text x="144" y="400" class="t-small t-muted t-end">time</text>
</svg>
